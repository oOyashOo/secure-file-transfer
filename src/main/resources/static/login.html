<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d0a"><title>SecureVault | Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080d0a;--surface:#111d15;--line:rgba(174,210,184,.14);--text:#edf6ef;--muted:#91a497;--green:#39f58a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,rgba(36,117,63,.2),transparent 45%),var(--bg);color:var(--text);font-family:"DM Sans",sans-serif}
.auth-shell{width:min(100%,430px);padding:38px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(20,34,25,.98),rgba(12,20,15,.98));box-shadow:0 28px 90px rgba(0,0,0,.4)}
.brand{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:12px;font:700 24px "Space Grotesk";letter-spacing:-.8px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:#06110a;background:linear-gradient(145deg,#76ffad,#1edb76)}.brand span:last-child span{color:var(--green)}
.subtitle{text-align:center;color:var(--muted);font-size:12px;margin:0 0 34px}.auth-shell h1{font:600 25px "Space Grotesk";margin:0 0 7px}.intro{color:var(--muted);font-size:12px;margin:0 0 25px}
.form-group{margin-bottom:18px}label{display:block;margin-bottom:8px;color:#b8cbbd;font-size:11px;font-weight:600}input{width:100%;height:46px;padding:0 13px;border:1px solid var(--line);border-radius:9px;outline:0;background:#09120c;color:var(--text);font:12px "DM Sans"}input:focus{border-color:rgba(57,245,138,.6);box-shadow:0 0 0 3px rgba(57,245,138,.08)}button{width:100%;height:46px;margin-top:7px;border:1px solid #52ffa0;border-radius:9px;color:#06120a;background:linear-gradient(120deg,#54f99a,#20d978);font-weight:700;font-size:12px;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.message{min-height:16px;margin:13px 0 0;text-align:center;font-size:11px;overflow-wrap:anywhere}.auth-switch{margin:25px 0 0;text-align:center;color:var(--muted);font-size:11px}.auth-switch a{color:var(--green);font-weight:700;text-decoration:none}
@media(max-width:480px){.auth-shell{padding:29px 22px}}
</style></head><body><main class="auth-shell">
<div class="brand"><span class="brand-mark">S</span><span>Secure<span>Vault</span>.</span></div>
<p class="subtitle">SECURE FILE TRANSFER PLATFORM</p>
<h1>Welcome back</h1><p class="intro">Sign in to access your secure workspace.</p>
<form id="loginForm">
<div class="form-group"><label for="email">Email address</label><input type="email" id="email" placeholder="you@example.com" autocomplete="username" required></div>
<div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required></div>
<button type="submit" id="loginButton">Sign in to SecureVault ↗</button><p class="message" id="loginMessage"></p>
</form><p class="auth-switch">New to SecureVault? <a href="/register.html">Create an account</a></p>
</main>
<script>
const loginForm=document.getElementById("loginForm"),loginButton=document.getElementById("loginButton"),loginMessage=document.getElementById("loginMessage");
loginForm.addEventListener("submit",async event=>{event.preventDefault();loginButton.disabled=true;loginButton.textContent="Signing in...";loginMessage.textContent="";
const formData=new URLSearchParams();formData.append("email",document.getElementById("email").value);formData.append("password",document.getElementById("password").value);
try{const response=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:formData});const result=await response.text();
if(response.ok){loginMessage.style.color="#39f58a";loginMessage.textContent=result;setTimeout(()=>window.location.href="/upload.html",700);}
else{loginMessage.style.color="#ff858b";loginMessage.textContent=result;}}
catch(error){loginMessage.style.color="#ff858b";loginMessage.textContent="Unable to connect to server.";}
finally{loginButton.disabled=false;loginButton.textContent="Sign in to SecureVault ↗";}});
</script></body></html>
